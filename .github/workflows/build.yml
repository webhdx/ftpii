name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: webhdx/devkitppc-libogc2:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Package
        run: |
          mkdir -p dist/ftpii
          cp ftpii.dol ftpii.elf README.txt LICENSE.txt dist/ftpii/

      - uses: actions/upload-artifact@v4
        with:
          name: ftpii-${{ github.sha }}
          path: dist/ftpii

      - name: Zip release
        if: startsWith(github.ref, 'refs/tags/')
        run: cd dist && zip -r ftpii-${{ github.ref_name }}.zip ftpii

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/ftpii-${{ github.ref_name }}.zip
